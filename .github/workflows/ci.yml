name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      # No `cache: pnpm` here on purpose: .npmrc points store-dir at a
      # repo-relative .pnpm-store, which does not play well with the action's
      # cache resolution.
      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # sharp ships prebuilt binaries and youtube-dl-exec has no postinstall
      # download, so a plain install is enough for static checks.
      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck
